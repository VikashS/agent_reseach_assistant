[project]
name = "agent-reseach-assistant"
version = "0.1.0"
description = "agent-reseach-assistant"
authors = [
    {name = "Vikash Singh", email = "vikash.singh@linuxmail.org"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "ollama==0.1.9",
    "openai>=2.30.0",
    "python-dotenv>=1.2.2",
    "requests==2.33.1",
    "tavily-python==0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"your_package" = ["*.json", "*.yaml"]

[project.urls]
Repository = "https://github.com/VikashS/agent_reseach_assistant.git"



[build-system]
requires = ["setuptools>=61.0.0", "wheel","hatchling"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_agent"]


# ============================================================================
# MCP Server Entry Point
# ============================================================================
[project.scripts]
pocket-agent-mcp-server = "ra_agent:main"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"


# code Quality and manitanability

[tool.black]
line-length = 120
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv"
]

[tool.mypy]
python_version = 3.11
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
exclude = "build|dist|/.venv"
